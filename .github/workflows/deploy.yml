name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Download pinned photo delivery bundle
        run: bun run photos:fetch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test photo pipeline
        run: bun run test:photos

      - name: Build
        run: bun run build

      - name: Verify production files over plain HTTP
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist > /tmp/jogly-photo-http.log 2>&1 &
          photo_server_pid=$!
          trap 'kill "$photo_server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4174/cotswolds/ > /dev/null && break
            sleep 1
          done
          bun run photos:smoke -- http://127.0.0.1:4174

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
